name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # jsdom@30 declares ^22.22.2 || ^24.15.0 || >=26, so CI should not
          # install against an engine the dependency disclaims.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # BookSum is bring-your-own-key: the key belongs in the user's browser and
      # must never be baked into a build. Nothing in the source does that today,
      # but a `define` in vite.config.ts or an inlined .env value would leak one
      # silently — invisible in review, and irreversible once published. grep
      # exits non-zero when it finds nothing, which is the passing case here.
      - name: No API key in the bundle
        run: |
          if grep -rIoE "AIza[0-9A-Za-z_-]{35}" dist/; then
            echo "::error::A Google API key-shaped string is present in dist/"
            exit 1
          fi
          echo "dist/ contains no key-shaped strings"
