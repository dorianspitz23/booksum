name: Deploy to GitHub Pages

# Manual only, on purpose. This app asks each visitor for their own Gemini API
# key, so a public demo is a page that collects keys — worth hosting as a
# deliberate decision rather than as a side effect of merging to main.
#
# It also cannot run by accident: with Pages not enabled on the repository,
# `configure-pages` fails, and an automatic trigger would put a permanent red
# cross on every push for a demo nobody asked for.
#
# To publish one: enable Pages (Settings -> Pages -> Source: GitHub Actions),
# then run this workflow from the Actions tab. The build is already verified
# against a real project-page path.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a live
# deploy can leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A project page is served from /<repo>/, so assets and routes both need
      # the base path baked in. Without it the deploy succeeds and the site
      # loads a blank screen.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages serves static files, so a deep link like /booksum/stats has no file
      # behind it and 404s on refresh. Copying index.html to 404.html hands those
      # requests back to the client router, which is what SPA hosting needs.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
